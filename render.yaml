# Render deployment manifest — Trinamix Conversion Workbench

services:
  # ── Backend (FastAPI + Beanie + MongoDB Atlas) ──────────────────────────
  - type: web
    name: trinamix-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    plan: free
    envVars:
      - key: MONGODB_URI
        sync: false          # set in Render dashboard from Atlas
      - key: MONGODB_DB
        value: conversion_workbench
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@trinamix.com
      - key: ADMIN_PASSWORD
        value: admin123
      - key: ADMIN_NAME
        value: Admin
      - key: AI_PROVIDER
        value: none
      - key: ANTHROPIC_API_KEY
        sync: false          # optional — enables AI Copilot

  # ── Frontend (React + Vite — static site) ──────────────────────────────
  - type: web
    name: trinamix-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://trinamix-conversion-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
