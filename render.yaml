# Render Blueprint — codified backup of the SPA deep-link fix.
#
# WHAT THIS FIXES
#   Visiting a client-side route directly (e.g. /login, /projects) or refreshing
#   one returned Render's plain "Not Found", because the static server has no file
#   at those paths — only index.html exists. The `routes:` rewrite below hands
#   every path to index.html so React Router can render the right screen.
#
# IMPORTANT
#   The live services were created via the Render dashboard, so this file does
#   NOT take effect on its own. It exists to (a) keep the fix in version control
#   and (b) let you adopt Blueprint management later (New > Blueprint > pick this
#   repo). The authoritative, immediate fix is the same rule set in the dashboard:
#     Static Site  ->  Redirects/Rewrites  ->
#       Source: /*   Destination: /index.html   Action: Rewrite
#
#   `name` must match the existing static site so Render reconciles it instead of
#   creating a duplicate. Adjust buildCommand / staticPublishPath if your service
#   settings differ. The backend web service is intentionally NOT defined here so
#   this Blueprint can't disturb it.

services:
  - type: web
    runtime: static
    name: tx-conversion-workbench
    # Frontend lives in the /frontend subdirectory of the repo.
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    # SPA fallback: serve index.html for every route so deep links / refreshes
    # don't 404. Rewrite (not Redirect) keeps the URL intact and returns 200.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
