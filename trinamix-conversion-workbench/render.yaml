# Render deployment manifest — Trinamix Conversion Workbench
# Docs: https://render.com/docs/render-yaml-spec

services:
  # ── Backend (FastAPI + Beanie + MongoDB Atlas) ───────────────────────────
  - type: web
    name: trinamix-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    plan: free
    envVars:
      - key: MONGODB_URI
        sync: false          # set in Render dashboard (from Atlas)
      - key: MONGODB_DB
        value: conversion_workbench
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@trinamix.com
      - key: ADMIN_PASSWORD
        sync: false          # set in Render dashboard
      - key: ADMIN_NAME
        value: Admin
      - key: FRONTEND_ORIGIN
        fromService:
          type: web
          name: trinamix-frontend
          property: host
      - key: AI_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
    disk:
      name: trinamix-uploads
      mountPath: /app/uploads
      sizeGB: 1

  # ── Frontend (React + Vite — static site) ────────────────────────────────
  - type: web
    name: trinamix-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: trinamix-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
